<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VoicePredict golden tests</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 16px; background: #111; color: #eee; }
    .pass { color: #6d6; }
    .fail { color: #f66; }
    pre { background: #1a1a1a; padding: 12px; border-radius: 8px; overflow: auto; }
  </style>
</head>
<body>
  <h1>predict golden tests</h1>
  <pre id="out">Running…</pre>
  <script src="../js/predict-data.js"></script>
  <script src="../js/predict-type.js"></script>
  <script src="../js/predict.js"></script>
  <script>
    (function () {
      const out = document.getElementById("out");
      const lines = [];
      let failed = 0;
      let passed = 0;

      function assert(name, cond, detail) {
        if (cond) {
          passed++;
          lines.push("PASS  " + name);
        } else {
          failed++;
          lines.push("FAIL  " + name + (detail ? " — " + detail : ""));
        }
      }

      function chipText(c) {
        if (c == null) return "";
        return typeof c === "string" ? c : String(c.text || "");
      }

      function topHas(chips, word) {
        const w = String(word).toLowerCase();
        return (chips || []).some((c) => chipText(c).toLowerCase() === w);
      }

      function topIs(chips, word) {
        return chips && chips[0] && chipText(chips[0]).toLowerCase() === String(word).toLowerCase();
      }

      const P = window.VoicePredict;
      assert("VoicePredict loaded", !!P);

      if (!P) {
        finish();
        return;
      }

      try {
        localStorage.removeItem(window.VoicePredictData.LS_PERSONAL_KEY);
        localStorage.removeItem(window.VoicePredictData.LS_PERSONAL_TEXT_KEY);
      } catch (_) {}

      P.init();
      // Mini lexicon (freq words + classes) without loading the full gzip asset.
      P._applyLexiconData({
        words: [
          "the", "i", "to", "a", "you", "want", "like", "are", "how", "think",
          "that", "this", "have", "would", "can", "do", "is", "it", "we", "go",
          "through", "door", "thanks", "please", "thank"
        ],
        classes: {
          verb: ["want", "like", "think", "have", "go", "do", "are", "is"],
          pron: ["i", "you", "we", "it"],
          prep: ["to", "through"],
          det: ["the", "a", "that", "this"]
        }
      });

      const empty = P.suggest("", 0);
      assert("empty field yields chips", empty.chips && empty.chips.length >= 3,
        JSON.stringify(empty.chips));
      assert("empty prefers I", topHas(empty.chips, "I") || topHas(empty.chips, "i"),
        JSON.stringify(empty.chips));

      const iWant = P.suggest("I want ", "I want ".length);
      assert(
        "I want → to near top",
        topIs(iWant.chips, "to") || topHas(iWant.chips, "to"),
        JSON.stringify(iWant.chips)
      );

      const howAre = P.suggest("How are ", "How are ".length);
      assert("How are → you", topIs(howAre.chips, "you") || topHas(howAre.chips, "you"),
        JSON.stringify(howAre.chips));

      const mid = P.suggest("I wan", "I wan".length);
      assert("mid-word wan → want", topHas(mid.chips, "want"),
        JSON.stringify(mid.chips));

      const like = P.suggest("I would like ", "I would like ".length);
      assert("I would like → to", topIs(like.chips, "to") || topHas(like.chips, "to"),
        JSON.stringify(like.chips));

      const midThink = P.suggest("I th", "I th".length);
      assert(
        "mid-word th has chips",
        midThink.chips && midThink.chips.length >= 1,
        JSON.stringify(midThink.chips)
      );
      assert(
        "chips are structured",
        midThink.chips[0] && typeof midThink.chips[0] === "object" && midThink.chips[0].text,
        JSON.stringify(midThink.chips[0])
      );

      // Orthography still runs on insert (contractions / auto-boundary).
      {
        const r = P.applyInsert("I", 1, 1, "m");
        assert(
          "applyInsert returns text",
          r && typeof r.text === "string" && r.text.length >= 1,
          JSON.stringify(r)
        );
      }

      finish();

      function finish() {
        lines.push("");
        lines.push(failed ? failed + " failed, " + passed + " passed" : "All " + passed + " passed");
        out.textContent = lines.join("\n");
        out.className = failed ? "fail" : "pass";
        document.title = (failed ? "FAIL" : "PASS") + " — predict tests";
      }
    })();
  </script>
</body>
</html>
